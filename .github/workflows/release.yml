name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: node scripts/check-release-version.mjs $env:GITHUB_REF_NAME

      - name: Verify UI
        run: npm run build

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Check Rust
        run: cargo check --workspace --locked

      - name: Build
        run: npm run tauri build

      - name: Collect files
        shell: pwsh
        run: ./scripts/collect-release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME `
            release/wasabipad.exe `
            $installer.FullName `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
