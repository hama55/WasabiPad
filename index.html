<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasabiPad</title>
  <link rel="stylesheet" href="/ui/prompt.css" />
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <div id="titlebar">
    <button class="bar-toggle" id="toggle-bars" title="アドレスバーとお気に入りバーを表示/非表示" aria-label="アドレスバーとお気に入りバーを表示/非表示">☰</button>
    <div id="tabs" data-tauri-drag-region></div>
    <div id="titletext" data-tauri-drag-region></div>
    <div id="wincontrols">
      <button id="win-min" title="最小化">&#xE921;</button>
      <button id="win-max" title="最大化">&#xE922;</button>
      <button id="win-close" title="閉じる">&#xE8BB;</button>
    </div>
  </div>
  <div id="navbars">
    <div id="topbar">
      <button id="addressbar-save" title="保存">💾</button>
      <button id="addressbar-save-as" title="名前を付けて保存...">💾⁺</button>
      <button id="addressbar-new" title="新規ウィンドウで開く">🗔</button>
      <button id="addressbar-find" title="検索と置換">🔍</button>
      <button id="addressbar-open" title="ファイルを選択...">📁</button>
      <button id="addressbar-fav" title="お気に入りに追加">☆</button>
      <div id="addressbar-shell">
        <div id="addressbar-breadcrumb" title="余白をクリックしてパスを編集"></div>
        <input id="addressbar" hidden spellcheck="false" autocomplete="off" placeholder="パスを入力して Enter で開く" />
      </div>
      <span id="save-notice" aria-live="polite"></span>
    </div>
    <div id="favbar"></div>
  </div>
  <div id="external-banner" hidden>
    <span>ファイルが他のアプリで変更されました</span>
    <button id="external-reload">再読込</button>
    <button id="external-ignore">無視</button>
    <button id="external-review">差分を確認</button>
  </div>
  <div id="main">
    <div id="sidebar" hidden></div>
    <div id="splitter" hidden></div>
    <button id="sidebar-toggle" title="フォルダビューを閉じる" hidden>&#xE76B;</button>
    <div id="editorhost">
      <div id="loading" role="status" aria-live="polite" hidden>
        <span class="loading-spinner" aria-hidden="true"></span>
        <span id="loading-message">読み込み中…</span>
      </div>
    </div>
    <div id="preview-splitter" role="separator" aria-label="プレビュー幅" hidden></div>
    <div id="preview" hidden>
      <iframe title="プレビュー"></iframe>
    </div>
    <button id="preview-toggle" title="プレビューを開く">&#xE76C;</button>
  </div>
  <div id="statusbar">
    <span id="st-mode"></span>
    <span id="st-binary" title="バイナリファイルのため編集できません" hidden></span>
    <label id="st-delimiter" hidden title="CSV区切り文字">区切り <input id="st-delimiter-input" value="," aria-label="CSV区切り文字" /></label>
    <button id="st-pos" title="指定行へ移動">1行 1列</button>
    <span class="st-sep" aria-hidden="true"></span>
    <span id="st-size"></span>
    <span class="st-sep" aria-hidden="true"></span>
    <span id="st-modified" title="ファイル保存日時"></span>
    <span class="st-sep" aria-hidden="true"></span>
    <button id="st-lines" title="最後の行へ移動">1 行</button>
    <span class="st-spacer"></span>
    <button id="st-font" title="フォントを変更"></button>
    <button id="st-font-size" title="フォントサイズを変更"></button>
    <span class="st-sep" aria-hidden="true"></span>
    <select id="st-indent" title="タブの表示幅">
    </select>
    <span class="st-sep" aria-hidden="true"></span>
    <button id="st-wrap" title="折り返し切替">折り返し: オフ</button>
    <span class="st-sep" aria-hidden="true"></span>
    <select id="st-source-enc" title="読込文字コード">
    </select>
    <span class="st-sep" aria-hidden="true"></span>
    <span id="st-eol" title="読込改行コード"></span>
    <span class="st-sep" aria-hidden="true"></span>
    <button id="st-theme" title="配色モード切替"></button>
  </div>
  <div id="dropdown" hidden></div>
  <script type="module" src="/ui/main.ts"></script>
</body>
</html>
