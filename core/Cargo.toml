[package]
name = "wasabipad-core"
version.workspace = true
edition.workspace = true

# UI非依存のコア: 文書モデル(mmap/overlay) + 編集 + 検索 + 保存。
# Tauriバックエンドとネイティブアプリの両方から共有される。
[lib]
name = "wasabipad_core"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
memchr = "2"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0"
# フォルダ検索は ripgrep のエンジンをライブラリとして使う (外部 rg.exe は同梱しない)。
# ignore=並列walk+gitignore、grep-*=SIMDリテラル検索/mmap/バイナリ検出/文字コード変換。
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

[dependencies.windows-sys]
version = "0.60"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
]
